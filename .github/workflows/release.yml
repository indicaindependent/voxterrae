# Release workflow for VoxTerrae. Builds the Windows portable exe on a tag,
# publishes SHA256SUMS and a build-provenance attestation, and creates the GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: python -m pip install "PySide6-Essentials>=6.8" "qasync>=0.27" "pyinstaller>=6.10" pytest
      - run: python -m pytest -q tests
        env: { PYTHONPATH: src, QT_QPA_PLATFORM: offscreen, VOXTERRAE_NO_UPDATE_CHECK: "1" }   # offline suite; live tests stay skipped without VOXTERRAE_LIVE_TESTS
      - run: python -m PyInstaller --noconfirm --clean build/voxterrae.spec
      # Smoke-run the frozen exe itself (0.1.0 shipped an exe that died on its first import; a green build is not a working exe).
      - run: |
          $p = Start-Process -FilePath dist/VoxTerrae.exe -ArgumentList '--demo','--shot','dist/smoke.png','640x360','--after','1' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe smoke run exited $($p.ExitCode)" }
          if (-not (Test-Path dist/smoke.png) -or (Get-Item dist/smoke.png).Length -lt 1000) { throw "exe smoke run produced no render" }
        env: { QT_QPA_PLATFORM: offscreen, VOXTERRAE_NO_UPDATE_CHECK: "1" }
      - run: |
          $h = (Get-FileHash dist/VoxTerrae.exe -Algorithm SHA256).Hash.ToLower()
          "$h  VoxTerrae.exe" | Out-File -Encoding ascii dist/SHA256SUMS
      # Provenance attestations are only issued for public repositories on the free plan.
      # This was originally gated on `!github.event.repository.private`, which is WRONG in a way
      # that is easy to miss: the event payload is a frozen snapshot of the push. The repo was
      # private when v0.1.1 was tagged, so after it went public a workflow RE-RUN still read
      # private=true from the replayed payload and skipped attestation on a public repo. A
      # condition that cannot see current state is worse than no condition, because it fails
      # silently and looks deliberate. Attempt it unconditionally instead and let it fail soft:
      # on a private repo the step errors and the exe still ships, which is the behaviour the
      # original `if` was reaching for.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        continue-on-error: true
        with: { subject-path: "dist/VoxTerrae.exe" }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/VoxTerrae.exe
            dist/SHA256SUMS
          generate_release_notes: true
