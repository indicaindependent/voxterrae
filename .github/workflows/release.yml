# Draft release workflow for VoxTerrae. Builds the Windows portable exe on a tag,
# publishes SHA256SUMS and a build-provenance attestation, and creates the GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: python -m pip install "PySide6-Essentials>=6.8" "qasync>=0.27" "pyinstaller>=6.10" pytest
      - run: python -m pytest -q tests/test_message.py tests/test_store.py
        env: { PYTHONPATH: src }
      - run: python -m PyInstaller --noconfirm --clean build/voxterrae.spec
      - run: |
          $h = (Get-FileHash dist/VoxTerrae.exe -Algorithm SHA256).Hash.ToLower()
          "$h  VoxTerrae.exe" | Out-File -Encoding ascii dist/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with: { subject-path: "dist/VoxTerrae.exe" }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/VoxTerrae.exe
            dist/SHA256SUMS
          generate_release_notes: true
